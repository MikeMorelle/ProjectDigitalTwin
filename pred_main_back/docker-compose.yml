services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0 #used by kafka legacy mode (could be updated to KRaft Kafka but for this project sufficient)
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_LOG4J_ROOT_LOGLEVEL: ERROR #show only errors, else log overload
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0 #kafka broker
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092 #port info for other containers
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1 #single broker setup
      KAFKA_LOG4J_ROOT_LOGLEVEL: "WARN" #only warn logs, else overload
      KAFKA_LOG4J_LOGGERS: "kafka=WARN,kafka.controller=WARN,kafka.log.LogCleaner=WARN,state.change.logger=WARN,kafka.producer.async.DefaultEventHandler=WARN"
    healthcheck:
      test:
        [
          "CMD",
          "kafka-topics",
          "--bootstrap-server",
          "localhost:9092",
          "--list",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8000:8000"

  kafka_manager:
    build:
      context: .
      dockerfile: kafka_manager/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    depends_on:
      timescaledb:
        condition: service_healthy
    ports:
      - "8501:8501"
    volumes:
      - .:/app
      - ./ml/models:/app/models #mount ml models into container

  ml:
    build:
      context: .
      dockerfile: ml/Dockerfile

  db:
    build:
      context: .
      dockerfile: db/Dockerfile
  timescaledb:
    image: timescale/timescaledb:latest-pg14
    container_name: timescaledb
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: predictive
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d predictive"]
      interval: 10s
      timeout: 5s
      retries: 10
